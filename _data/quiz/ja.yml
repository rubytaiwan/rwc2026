# ── Ruby 選択式クイズ（日本語）──────────────────────────────
# 前田さん向け：このファイルを編集するだけで出題を差し替えられます（JS・HTML は触らなくて OK）。
# 下の4問は動作確認用のプレースホルダーです。自由に書き換え・追加してください。
# 問題が3問より多い場合は、プレイごとにランダムで3問が出題されます（出題数は _config.yml の choice_question_count）。
#
# 各問の項目:
#   question:    問題文（必須）
#   code:        コードを見せたい場合のみ（任意。| のブロックで複数行OK）
#   answer:      正解の選択肢（必須・1つ）
#   wrong:       不正解の選択肢（必須・ちょうど3つ。選択肢は表示時にシャッフルされます）
#   explanation: 解説（任意。回答後に表示されます）
#   check:       code が無い問題用（任意）。選択肢を %s に代入して true になったものが正解。例: "%s.is_a?(Symbol)"
#                正誤判定は mruby で実行して行います（code があれば code の実行結果＝選択肢の文字列、が正解）。

- question: "次のコードを実行すると、何が表示されますか？"
  code: |
    p [1, 2, 3].map { |x| x * 2 }
  answer: "[2, 4, 6]"
  wrong:
    - "[1, 2, 3]"
    - "[2, 4]"
    - "[1, 4, 9]"
  explanation: "map はブロックの結果を集めた新しい配列を返します。"

- question: "次のコードを実行すると、何が表示されますか？"
  code: |
    puts "ruby".upcase
  answer: "RUBY"
  wrong:
    - "Ruby"
    - "ruby"
    - "nil"
  explanation: "upcase は文字列をすべて大文字にします。"

- question: "シンボル（Symbol）はどれですか？"
  check: "%s.is_a?(Symbol)"
  answer: ":matsue"
  wrong:
    - "\"matsue\""
    - "matsue"
    - "%w[matsue]"
  explanation: "シンボルはコロン付きで書きます。同じシンボルは常に同一のオブジェクトです。"

- question: "次のコードを実行すると、何が表示されますか？"
  code: |
    p 10.divmod(3)
  answer: "[3, 1]"
  wrong:
    - "[3.33, 1]"
    - "[1, 3]"
    - "3"
  explanation: "divmod は [商, 余り] の配列を返します。"
