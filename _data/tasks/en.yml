# ── Ruby Interactive Challenge Questions (English) ──────────
#
# Mirrors the Japanese bank (ja.yml): one question per difficulty.
# secret_type, secret_pool, answer and tips[].code match ja.yml;
# only question, category and tips[].desc are in English.
# ─────────────────────────────────────────────────────────────

# ── Easy ─────────────────────────────────────────────────────

# Task 1: Case conversion
- category: String Operations
  difficulty: easy
  secret_type: string
  secret_pool: ["ruby", "spinel"]
  question: "Convert every character of gem to uppercase."
  answer: ".upcase"
  tips:
    - { code: '"Hello".downcase', desc: 'Returns "hello"' }
    - { code: '"Hello".upcase', desc: 'Returns "HELLO"' }
    - { code: '"Hello".swapcase', desc: 'Returns "hELLO"' }
    - { code: '"hello".capitalize', desc: 'Returns "Hello"' }

### Medium

# Task 2: Remove space characters
- category: String Operations
  difficulty: medium
  secret_type: string
  secret_pool: [" Ruby City Matsue "]
  question: "Remove all space characters from gem."
  answer: '.delete(" ")'
  tips:
    - { code: '" a b ".lstrip', desc: 'Returns "a b "' }
    - { code: '" a b ".rstrip', desc: 'Returns " a b"' }
    - { code: '" a b ".strip', desc: 'Returns "a b"' }
    - { code: '"abaca".delete("a")', desc: 'Returns "bc"' }

### Hard

# Task 3: Map
- category: Array Operations
  difficulty: hard
  secret_type: array
  array_length: 5
  element_range: [1, 100]
  question: "Double every element of gem."
  answer: ".map { |i| i * 2 }"
  tips:
    - { code: "[1, 2, 3].each { |i| p i }", desc: "Prints 1, 2 and 3, one per line" }
    - { code: "[1, 2, 3].map { |i| i.to_s }", desc: 'Returns ["1", "2", "3"]' }
    - { code: "[1, 2, 3].filter { |i| i &lt; 3 }", desc: 'Returns [1, 2]' }
    - { code: "15 * 2", desc: 'Returns 30' }
