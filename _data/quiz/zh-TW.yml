#   check:       （選填）沒有 code 的題目用。把選項代入 %s，結果為 true 的是正解。例："%s.is_a?(Symbol)"
#                正誤由 mruby 實際執行判定（有 code 時，選項等於程式輸出才算對）。
# ── Ruby 選擇題（繁體中文）──────────────────────────────────
# 欄位說明見 ja.yml。以下 4 題為測試用佔位題目，請自由改寫／新增。
# 題數超過 3 題時，每位玩家會隨機抽 3 題（_config.yml 的 choice_question_count）。

- question: "執行下面的程式碼，會印出什麼？"
  code: |
    p [1, 2, 3].map { |x| x * 2 }
  answer: "[2, 4, 6]"
  wrong:
    - "[1, 2, 3]"
    - "[2, 4]"
    - "[1, 4, 9]"
  explanation: "map 會回傳一個由區塊結果組成的新陣列。"

- question: "執行下面的程式碼，會印出什麼？"
  code: |
    puts "ruby".upcase
  answer: "RUBY"
  wrong:
    - "Ruby"
    - "ruby"
    - "nil"
  explanation: "upcase 會把字串全部轉成大寫。"

- question: "下列哪一個是 Symbol？"
  check: "%s.is_a?(Symbol)"
  answer: ":matsue"
  wrong:
    - "\"matsue\""
    - "matsue"
    - "%w[matsue]"
  explanation: "Symbol 以冒號開頭，相同的 Symbol 永遠是同一個物件。"

- question: "執行下面的程式碼，會印出什麼？"
  code: |
    p 10.divmod(3)
  answer: "[3, 1]"
  wrong:
    - "[3.33, 1]"
    - "[1, 3]"
    - "3"
  explanation: "divmod 回傳 [商, 餘數] 的陣列。"
