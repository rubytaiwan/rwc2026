#   check:       （選填）沒有 code 的題目用。把選項代入 %s，結果為 true 的是正解。例："%s.is_a?(Symbol)"
#                正誤由 mruby 實際執行判定（有 code 時，選項等於程式輸出才算對）。
# ── Ruby 選擇題（繁體中文）──────────────────────────────────
# 以下 3 題與 ja.yml 相同，請自由改寫／新增。
# 題數超過 3 題時，每位玩家會隨機抽 3 題（_config.yml 的 choice_question_count）。


- question: "Ruby 是誰創造的？"
  answer: "松本行弘"
  wrong:
    - "松本弘行"
    - "上定昭仁"
    - "丸山達也"
  explanation: "上定昭仁是松江市市長，丸山達也是島根縣知事。"

- question: "執行下面的程式碼，會印出什麼？"
  code: |
    puts "e-ztam".reverse.capitalize
  answer: "Matz-e"
  wrong:
    - "E-ztam"
    - "matz-e"
    - "Matz-E"
  explanation: "reverse 會把字元順序反轉，capitalize 只會把第一個字母變成大寫。"

- question: '哪一段程式碼會回傳 "I love Spinel"？'
  check: "(%s) == 'I love Spinel'"
  answer: '"I love Ruby".sub("Ruby", "Spinel")'
  wrong:
    - '"I love Ruby".tr("Ruby", "Spinel")'
    - '"I love Ruby".include?("Ruby")'
    - '"I love Ruby" - "Ruby" + "Spinel"'
  explanation: '"I love Ruby".tr("Ruby", "Spinel") 會回傳 "I love Spin"。'
