- id: js_odd_filter
  code: "[1, 2, 3, 4, 5].filter(n => n % 2 !== 0)\n// => [1, 3, 5]"
  expected: "[1, 3, 5]"
  answer: "[1, 2, 3, 4, 5].select(&:odd?)"
  tips:
    - { code: "Array#select", desc: "条件に合う要素を絞り込む" }
    - { code: "Integer#odd?", desc: "奇数かどうかを判定" }
    - { code: "Symbol#to_proc (&:odd?)", desc: "メソッド名を Proc に変換" }

- id: js_sum
  code: "[1, 2, 3, 4, 5].reduce((acc, n) => acc + n, 0)\n// => 15"
  expected: "15"
  answer: "[1, 2, 3, 4, 5].sum"
  tips:
    - { code: "Array#sum", desc: "全要素を合計" }
    - { code: "Array#reduce(:+)", desc: "こう書くこともできる" }

- id: js_reverse_string
  code: "\"hello\".split(\"\").reverse().join(\"\")\n// => \"olleh\""
  expected: "olleh"
  answer: '"hello".reverse'
  tips:
    - { code: "String#reverse", desc: "文字列を反転" }

- id: js_square
  code: "[1, 2, 3].map(n => n ** 2)\n// => [1, 4, 9]"
  expected: "[1, 4, 9]"
  answer: "[1, 2, 3].map { |n| n ** 2 }"
  tips:
    - { code: "Array#map", desc: "各要素を変換" }
    - { code: "** 演算子", desc: "べき乗" }

- id: js_max
  code: "Math.max(...[3, 1, 4, 1, 5, 9, 2, 6])\n// => 9"
  expected: "9"
  answer: "[3, 1, 4, 1, 5, 9, 2, 6].max"
  tips:
    - { code: "Array#max", desc: "最大値を取得" }
