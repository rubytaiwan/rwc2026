- id: py_divisible_by_3
  code: "[n for n in range(1, 11) if n % 3 == 0]\n# => [3, 6, 9]"
  expected: "[3, 6, 9]"
  answer: "(1..10).select { |n| n % 3 == 0 }"
  tips:
    - { code: "Range#select", desc: "Ranges can be filtered too" }
    - { code: "(1..10)", desc: "A Ruby Range object" }

- id: py_sum
  code: "sum([1, 2, 3, 4, 5])\n# => 15"
  expected: "15"
  answer: "[1, 2, 3, 4, 5].sum"
  tips:
    - { code: "Array#sum", desc: "Sum all elements" }

- id: py_title_case
  code: "\"hello world\".title()\n# => \"Hello World\""
  expected: "Hello World"
  answer: '"hello world".split.map(&:capitalize).join(" ")'
  tips:
    - { code: "String#split", desc: "Splits on whitespace when called without arguments" }
    - { code: "String#capitalize", desc: "Capitalize the first letter" }
    - { code: "Array#join", desc: "Join an array into a string" }

- id: py_count_gt
  code: "len([x for x in [1, 2, 3, 4, 5] if x > 2])\n# => 3"
  expected: "3"
  answer: "[1, 2, 3, 4, 5].count { |n| n > 2 }"
  tips:
    - { code: "Array#count { |n| ... }", desc: "Count elements matching a condition" }

- id: py_double
  code: "list(map(lambda x: x * 2, [1, 2, 3]))\n# => [2, 4, 6]"
  expected: "[2, 4, 6]"
  answer: "[1, 2, 3].map { |n| n * 2 }"
  tips:
    - { code: "Array#map", desc: "Transform each element" }
