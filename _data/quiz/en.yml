#   check:       (optional) for questions without code. The option is substituted for %s; the one that evaluates to true is correct. e.g. "%s.is_a?(Symbol)"
#                Answers are judged by running Ruby in mruby (with code: the option equal to the program's output is correct).
# ── Ruby multiple-choice quiz (English) ─────────────────────
# Field reference: see ja.yml. The 4 questions below are placeholders — edit or add freely.
# With more than 3 questions, each player gets a random 3 (choice_question_count in _config.yml).

- question: "What does this code print?"
  code: |
    p [1, 2, 3].map { |x| x * 2 }
  answer: "[2, 4, 6]"
  wrong:
    - "[1, 2, 3]"
    - "[2, 4]"
    - "[1, 4, 9]"
  explanation: "map returns a new array made of the block's results."

- question: "What does this code print?"
  code: |
    puts "ruby".upcase
  answer: "RUBY"
  wrong:
    - "Ruby"
    - "ruby"
    - "nil"
  explanation: "upcase converts the whole string to uppercase."

- question: "Which one is a Symbol?"
  check: "%s.is_a?(Symbol)"
  answer: ":matsue"
  wrong:
    - "\"matsue\""
    - "matsue"
    - "%w[matsue]"
  explanation: "Symbols start with a colon; the same Symbol is always the same object."

- question: "What does this code print?"
  code: |
    p 10.divmod(3)
  answer: "[3, 1]"
  wrong:
    - "[3.33, 1]"
    - "[1, 3]"
    - "3"
  explanation: "divmod returns [quotient, remainder]."
