# ── Ruby 選択式クイズ（日本語）──────────────────────────────
# 前田さん向け：このファイルを編集するだけで出題を差し替えられます（JS・HTML は触らなくて OK）。
# 下の4問は動作確認用のプレースホルダーです。自由に書き換え・追加してください。
# 問題が3問より多い場合は、プレイごとにランダムで3問が出題されます（出題数は _config.yml の choice_question_count）。
#
# 各問の項目:
#   question:    問題文（必須）
#   code:        コードを見せたい場合のみ（任意。| のブロックで複数行OK）
#   answer:      正解の選択肢（必須・1つ）
#   wrong:       不正解の選択肢（必須・ちょうど3つ。選択肢は表示時にシャッフルされます）
#   explanation: 解説（任意。回答後に表示されます）
#   check:       code が無い問題用（任意）。選択肢を %s に代入して true になったものが正解。例: "%s.is_a?(Symbol)"
#                正誤判定は mruby で実行して行います（code があれば code の実行結果＝選択肢の文字列、が正解）。

- question: "Rubyを作ったのは誰ですか？"
  answer: "まつもとゆきひろさん"
  wrong:
    - "まつもとひろゆきさん"
    - "上定昭仁さん"
    - "丸山達也さん"
  explanation: "上定昭仁さんは松江市長、丸山達也さんは島根県知事です。"

- question: "次のコードを実行すると、何が表示されますか？"
  code: |
    puts "e-ztam".reverse.capitalize
  answer: "Matz-e"
  wrong:
    - "E-ztam"
    - "matz-e"
    - "Matz-E"
  explanation: "reverseは文字を逆順にし、capitalizeは先頭を大文字にします。"

- question: '"I love Spinel"を返すコードはどれですか？'
  check: "(%s) == 'I love Spinel'"
  answer: '"I love Ruby".sub("Ruby", "Spinel")'
  wrong:
    - '"I love Ruby".tr("Ruby", "Spinel")'
    - '"I love Ruby".include?("Ruby")'
    - '"I love Ruby" - "Ruby" + "Spinel"'
  explanation: '"I love Ruby".tr("Ruby", "Spinel")は"I love Spin"になります。'
