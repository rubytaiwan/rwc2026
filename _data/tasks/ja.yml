# ── Ruby インタラクティブ チャレンジ問題集（日本語）──────────
#
# 日本のネット文化に合わせて問題文を改変。
# answer, secret_type, difficulty, tips[].code は変更なし。
# 翻訳・改変対象: question, category, tips[].desc のみ。
# ─────────────────────────────────────────────────────────────

# ── Easy ─────────────────────────────────────────────────────

# Task 1: Case conversion
- category: 文字列操作
  difficulty: easy
  secret_type: string
  secret_pool: ["ruby", "spinel"]
  question: "gem の文字をすべて大文字にしてください。"
  answer: ".upcase"
  tips:
    - { code: '"Hello".downcase', desc: '"hello"を返します' }
    - { code: '"Hello".upcase', desc: '"HELLO"を返します' }
    - { code: '"Hello".swapcase', desc: '"hELLO"を返します' }
    - { code: '"hello".capitalize', desc: '"Hello"を返します' }

### Medium

# Task 2: Remove space characters
- category: 文字列操作
  difficulty: medium
  secret_type: string
  secret_pool: [" Ruby City Matsue "]
  question: "gem の空白文字をすべて除去してください。"
  answer: '.delete(" ")'
  tips:
    - { code: '" a b ".lstrip', desc: '"a b "を返します' }
    - { code: '" a b ".rstrip', desc: '" a b"を返します' }
    - { code: '" a b ".strip', desc: '"a b"を返します' }
    - { code: '"abaca".delete("a")', desc: '"bc"を返します' }

### Hard

# Task 3: Map
- category: 配列操作
  difficulty: hard
  secret_type: array
  array_length: 5
  element_range: [1, 100]
  question: "gem のすべての要素を2倍にしてください。"
  answer: ".map { |i| i * 2 }"
  tips:
    - { code: "[1, 2, 3].each { |i| p i }", desc: "1, 2, 3が一行ずつ出力されます" }
    - { code: "[1, 2, 3].map { |i| i.to_s }", desc: '["1", "2", "3"]を返します' }
    - { code: "[1, 2, 3].filter { |i| i &lt; 3 }", desc: '[1, 2]を返します' }
    - { code: "15 * 2", desc: '30を返します' }
