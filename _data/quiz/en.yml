#   check:       (optional) for questions without code. The option is substituted for %s; the one that evaluates to true is correct. e.g. "%s.is_a?(Symbol)"
#                Answers are judged by running Ruby in mruby (with code: the option equal to the program's output is correct).
# ── Ruby multiple-choice quiz (English) ─────────────────────
# The 3 questions below mirror ja.yml — edit or add freely.
# With more than 3 questions, each player gets a random 3 (choice_question_count in _config.yml).


- question: "Who created Ruby?"
  answer: "Yukihiro Matsumoto"
  wrong:
    - "Hiroyuki Matsumoto"
    - "Akihito Uesada"
    - "Tatsuya Maruyama"
  explanation: "Akihito Uesada is the mayor of Matsue, and Tatsuya Maruyama is the governor of Shimane Prefecture."

- question: "What does this code print?"
  code: |
    puts "e-ztam".reverse.capitalize
  answer: "Matz-e"
  wrong:
    - "E-ztam"
    - "matz-e"
    - "Matz-E"
  explanation: "reverse reverses the characters, and capitalize uppercases only the first letter."

- question: 'Which code returns "I love Spinel"?'
  check: "(%s) == 'I love Spinel'"
  answer: '"I love Ruby".sub("Ruby", "Spinel")'
  wrong:
    - '"I love Ruby".tr("Ruby", "Spinel")'
    - '"I love Ruby".include?("Ruby")'
    - '"I love Ruby" - "Ruby" + "Spinel"'
  explanation: '"I love Ruby".tr("Ruby", "Spinel") returns "I love Spin".'
