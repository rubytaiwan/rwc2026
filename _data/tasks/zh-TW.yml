# ── Ruby 互動挑戰題庫 ─────────────────────────────────────
#
# secret_type 說明：
#   integer      — 從 secret_range: [min, max] 隨機取整數
#   odd_integer  — 從 secret_range: [min, max] 隨機取奇數
#   string       — 從 secret_pool 隨機取字串
#   array        — 生成 array_length 個整數，範圍 element_range: [min, max]
#
# answer  — 正確 Ruby 方法（含前面的點，例如 ".next"）
# difficulty — easy | medium | hard
# ─────────────────────────────────────────────────────────

# 與日文題庫（ja.yml）同步：每個難度各 1 題。
# secret_type、secret_pool、answer、tips[].code 與 ja.yml 相同，
# 只有 question、category、tips[].desc 是繁體中文。

# ── Easy ─────────────────────────────────────────────────

# 題目 1：大小寫轉換
- category: 字串操作
  difficulty: easy
  secret_type: string
  secret_pool: ["ruby", "spinel"]
  question: "把 gem 的每個字元都轉成大寫。"
  answer: ".upcase"
  tips:
    - { code: '"Hello".downcase', desc: '回傳 "hello"' }
    - { code: '"Hello".upcase', desc: '回傳 "HELLO"' }
    - { code: '"Hello".swapcase', desc: '回傳 "hELLO"' }
    - { code: '"hello".capitalize', desc: '回傳 "Hello"' }

# ── Medium ───────────────────────────────────────────────

# 題目 2：移除空白字元
- category: 字串操作
  difficulty: medium
  secret_type: string
  secret_pool: [" Ruby City Matsue "]
  question: "把 gem 裡所有的空白字元移除。"
  answer: '.delete(" ")'
  tips:
    - { code: '" a b ".lstrip', desc: '回傳 "a b "' }
    - { code: '" a b ".rstrip', desc: '回傳 " a b"' }
    - { code: '" a b ".strip', desc: '回傳 "a b"' }
    - { code: '"abaca".delete("a")', desc: '回傳 "bc"' }

# ── Hard ─────────────────────────────────────────────────

# 題目 3：Map
- category: 陣列操作
  difficulty: hard
  secret_type: array
  array_length: 5
  element_range: [1, 100]
  question: "把 gem 的每個元素都變成兩倍。"
  answer: ".map { |i| i * 2 }"
  tips:
    - { code: "[1, 2, 3].each { |i| p i }", desc: "一行一個印出 1、2、3" }
    - { code: "[1, 2, 3].map { |i| i.to_s }", desc: '回傳 ["1", "2", "3"]' }
    - { code: "[1, 2, 3].filter { |i| i &lt; 3 }", desc: '回傳 [1, 2]' }
    - { code: "15 * 2", desc: '回傳 30' }
